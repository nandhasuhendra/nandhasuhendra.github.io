# Site Settings
title: Nanda Suhendra
tagline: Backend Engineer | Ruby on Rails Developer
description: >-
  Personal website of Nanda Suhendra - Backend Engineer at Dropsuite specializing in
  Ruby on Rails, APIs, and reliable backend systems. Articles on backend development,
  testing, and infrastructure.
url: "https://nandhasuhendra.github.io" # Change this to your GitHub Pages URL
baseurl: "" # Leave empty for user/org pages, use "/blog" for project pages

# Author Information
author:
  name: Nanda Suhendra
  email: nandhasuhendra@gmail.com
  bio: >-
    Backend Engineer at Dropsuite. I build reliable backend applications with Ruby on Rails
    and enjoy making systems easier to operate and test. Focused on APIs, test coverage,
    CI/CD, and mentoring on pragmatic engineering solutions.
  avatar: /assets/images/hero/avatar.jpeg
  location: Indonesia
  social:
    github: nandhasuhendra
    linkedin: sang-putu-nanda-suhendra
    instagram: nandha_suhendra
    email: nandhasuhendra@gmail.com

# Build Settings
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/
timezone: Asia/Jakarta
theme: null # Disable default theme

# Collections
collections:
  projects:
    output: false
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Nanda Suhendra"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Pagination
paginate: 10
paginate_path: "/posts/page:num/"

# Plugins (GitHub Pages compatible only)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - node_modules
  - vendor

# SEO
logo: /assets/favicons/favicon-512.png
social:
  name: Nanda Suhendra
  links:
    - https://github.com/nandhasuhendra
    - https://linkedin.com/in/sang-putu-nanda-suhendra
    - https://www.threads.com/@nandha_suhendra
    - https://instagram.com/nandha_suhendra

# Google Analytics 4
google_analytics: G-7Y3EV40V4Z

# Reading Time (words per minute)
words_per_minute: 200
