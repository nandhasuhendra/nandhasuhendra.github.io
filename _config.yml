# Site Settings
title: Nanda Suhendra
tagline: Software Engineer · Turning coffee into working code since 2019
description: >-
  Personal website of Nanda Suhendra — Software Engineer who loves building things that
  actually work in production. Writing about real-world engineering, Ruby on Rails, Go,
  and the lessons learned the hard way.
url: "https://nandhasuhendra.github.io" # Change this to your GitHub Pages URL
baseurl: "" # Leave empty for user/org pages, use "/blog" for project pages

# Author Information
author:
  name: Nanda Suhendra
  email: nandhasuhendra@gmail.com
  bio: >-
    Just someone who really loves writing code and still can't quite believe he gets paid
    for it. I work as a Software Engineer at Dropsuite, mostly tinkering with Ruby on
    Rails and Go, and I'm still learning something new (often the hard way) almost every
    day. I write here mostly so future me remembers what past me figured out, and maybe
    it helps you too. Outside of code, I'm a husband who loves going on little adventures
    with his lovely wife.
  avatar: /assets/images/hero/avatar.jpeg
  location: Indonesia
  social:
    github: nandhasuhendra
    linkedin: sang-putu-nanda-suhendra
    instagram: nandha_suhendra
    email: nandhasuhendra@gmail.com

# Build Settings
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/
timezone: Asia/Jakarta
theme: null # Disable default theme

# Collections
collections:
  projects:
    output: false
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Nanda Suhendra"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Pagination
paginate: 10
paginate_path: "/posts/page:num/"

# Plugins (GitHub Pages compatible only)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - node_modules
  - vendor

# SEO
logo: /assets/favicons/favicon-512.png
social:
  name: Nanda Suhendra
  links:
    - https://github.com/nandhasuhendra
    - https://linkedin.com/in/sang-putu-nanda-suhendra
    - https://www.threads.com/@nandha_suhendra
    - https://instagram.com/nandha_suhendra

# Google Analytics 4
google_analytics: G-7Y3EV40V4Z

# Reading Time (words per minute)
words_per_minute: 200
