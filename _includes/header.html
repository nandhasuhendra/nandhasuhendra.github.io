<header class="bg-white border-b sticky top-0 z-50" x-data="{ mobileMenuOpen: false }">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex-shrink-0">
        <a href="{{ '/' | relative_url }}"
          class="text-2xl font-bold text-gray-900 hover:text-gray-700 transition-colors">
          {{ site.title }}
        </a>
      </div>

      <div class="hidden md:flex md:items-center md:space-x-8">
        <a href="{{ '/' | relative_url }}" class="text-gray-700 hover:text-gray-900 font-medium transition-colors">
          Home
        </a>
        <a href="{{ '/posts/' | relative_url }}"
          class="text-gray-700 hover:text-gray-900 font-medium transition-colors">
          Posts
        </a>
        <a href="{{ '/projects/' | relative_url }}"
          class="text-gray-700 hover:text-gray-900 font-medium transition-colors">
          Projects
        </a>
      </div>

      <div class="md:hidden">
        <button @click="mobileMenuOpen = !mobileMenuOpen" type="button" class="text-gray-900 hover:text-gray-700"
          aria-label="Toggle menu">
          <i data-lucide="menu" x-show="!mobileMenuOpen" class="h-6 w-6"></i>
          <i data-lucide="x" x-show="mobileMenuOpen" class="h-6 w-6"></i>
        </button>
      </div>
    </div>

    <div x-show="mobileMenuOpen" x-collapse class="md:hidden border-t">
      <div class="py-4 space-y-2">
        <a href="{{ '/' | relative_url }}"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-gray-900">Home</a>
        <a href="{{ '/posts/' | relative_url }}"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-gray-900">Posts</a>
        <a href="{{ '/projects/' | relative_url }}"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-gray-900">Projects</a>
        <a href="{{ '/tools/' | relative_url }}"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-gray-900">Tools</a>
      </div>
    </div>
  </nav>
</header>
