<header class="bg-white dark:bg-gray-900 border-b dark:border-gray-800 sticky top-0 z-50" x-data="{ mobileMenuOpen: false }">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex-shrink-0">
        <a href="{{ '/' | relative_url }}"
          class="text-2xl font-bold text-gray-900 dark:text-white hover:text-gray-700 dark:hover:text-gray-300 transition-colors">
          {{ site.title }}
        </a>
      </div>

      <div class="hidden md:flex md:items-center md:space-x-8">
        <a href="{{ '/' | relative_url }}" class="text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white font-medium transition-colors">
          Home
        </a>
        <a href="{{ '/posts/' | relative_url }}"
          class="text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white font-medium transition-colors">
          Posts
        </a>
        <a href="{{ '/projects/' | relative_url }}"
          class="text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white font-medium transition-colors">
          Projects
        </a>
        <button @click="toggleTheme()" type="button"
          class="p-2 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
          aria-label="Toggle dark mode">
          <i data-lucide="moon" class="h-5 w-5 block dark:hidden"></i>
          <i data-lucide="sun" class="h-5 w-5 hidden dark:block"></i>
        </button>
      </div>

      <div class="flex items-center gap-2 md:hidden">
        <button @click="toggleTheme()" type="button" class="text-gray-900 dark:text-gray-300 hover:text-gray-700 dark:hover:text-white p-2"
          aria-label="Toggle dark mode">
          <i data-lucide="moon" class="h-5 w-5 block dark:hidden"></i>
          <i data-lucide="sun" class="h-5 w-5 hidden dark:block"></i>
        </button>
        <button @click="mobileMenuOpen = !mobileMenuOpen" type="button" class="text-gray-900 dark:text-gray-300 hover:text-gray-700 dark:hover:text-white"
          aria-label="Toggle menu">
          <i data-lucide="menu" x-show="!mobileMenuOpen" class="h-6 w-6"></i>
          <i data-lucide="x" x-show="mobileMenuOpen" class="h-6 w-6"></i>
        </button>
      </div>
    </div>

    <div x-show="mobileMenuOpen" x-collapse class="md:hidden border-t dark:border-gray-800">
      <div class="py-4 space-y-2">
        <a href="{{ '/' | relative_url }}"
          class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white">Home</a>
        <a href="{{ '/posts/' | relative_url }}"
          class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white">Posts</a>
        <a href="{{ '/projects/' | relative_url }}"
          class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white">Projects</a>
        <a href="{{ '/tools/' | relative_url }}"
          class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white">Tools</a>
      </div>
    </div>
  </nav>
</header>
